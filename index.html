<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenAI Posts Viewer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <!-- Header -->
        <header class="row bg-primary text-white py-3 mb-4">
            <div class="col-12">
                <div class="d-flex align-items-center justify-content-between flex-wrap">
                    <div class="d-flex align-items-center mb-2 mb-md-0">
                        <h1 class="h3 mb-0 me-4"><i class="fas fa-newspaper me-2"></i>GenAI Posts Viewer</h1>
                        
                        <!-- Source Selector -->
                        <div class="source-selector">
                            <label for="sourceSelect" class="form-label mb-1">
                                <i class="fas fa-database me-1"></i>Source:
                            </label>
                            <select id="sourceSelect" class="form-select source-dropdown">
                                <option value="">Select a source...</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="d-flex align-items-center gap-3">
                        <!-- Posts Counter -->
                        <div class="post-counter">
                            <span id="currentPost">0</span> / <span id="totalPosts">0</span>
                        </div>
                        
                        <!-- Refresh Button -->
                        <button id="refreshSources" class="btn refresh-btn" title="Refresh Sources">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="row">
            <!-- Left Panel - Original News -->
            <div class="col-lg-5 col-md-6 mb-4">
                <div class="card h-100 shadow-sm original-news-card">
                    <div class="card-header bg-light">
                        <h5 class="mb-0"><i class="fas fa-newspaper me-2"></i>Original News</h5>
                    </div>
                    <div class="card-body">
                        <h6 class="card-title original-title" id="originalTitle">Loading...</h6>
                        <p class="card-text original-brief" id="originalBrief">Loading...</p>
                        <div class="source-info mt-3">
                            <small class="text-muted">
                                <i class="fas fa-building me-1"></i>
                                Source: <span id="newsSource">-</span>
                            </small>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel - Generated Post -->
            <div class="col-lg-7 col-md-6 mb-4">
                <div class="card h-100 shadow-sm generated-post-card">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0"><i class="fas fa-robot me-2"></i>Generated Post</h5>
                    </div>
                    <div class="card-body">
                        <!-- Post Content -->
                        <div class="post-content mb-4">
                            <h6 class="card-title generated-title" id="generatedTitle">Loading...</h6>
                            <p class="card-text generated-body" id="generatedBody">Loading...</p>
                            
                            <!-- Post Meta Information -->
                            <div class="post-meta mb-3">
                                <div class="row">
                                    <div class="col-md-6">
                                        <small class="text-muted">
                                            <i class="fas fa-palette me-1"></i>
                                            Tone: <span id="postTone" class="badge bg-info">-</span>
                                        </small>
                                    </div>
                                    <div class="col-md-6">
                                        <small class="text-muted">
                                            <i class="fas fa-align-left me-1"></i>
                                            <span id="postLength">-</span>
                                        </small>
                                    </div>
                                </div>
                            </div>

                            <!-- Tags -->
                            <div class="tags mb-3">
                                <small class="text-muted mb-1 d-block"><i class="fas fa-tags me-1"></i>Tags:</small>
                                <div id="postTags"></div>
                            </div>

                            <!-- Suggested Communities -->
                            <div class="communities mb-3">
                                <small class="text-muted mb-1 d-block"><i class="fas fa-users me-1"></i>Suggested Communities:</small>
                                <div id="suggestedCommunities"></div>
                            </div>
                        </div>

                        <!-- Comments Section -->
                        <div class="comments-section">
                            <h6 class="comments-header mb-3">
                                <i class="fas fa-comments me-2"></i>Comments (<span id="commentsCount">0</span>)
                            </h6>
                            <div id="commentsContainer" class="comments-container">
                                <!-- Comments will be loaded here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Navigation Controls -->
        <div class="row">
            <div class="col-12">
                <div class="navigation-controls d-flex justify-content-between align-items-center py-3">
                    <button id="prevBtn" class="btn btn-outline-primary btn-lg" disabled>
                        <i class="fas fa-chevron-left me-2"></i>Previous Post
                    </button>
                    
                    <div class="navigation-info text-center">
                        <div class="progress mx-3" style="width: 200px;">
                            <div id="progressBar" class="progress-bar bg-success" role="progressbar" style="width: 0%"></div>
                        </div>
                    </div>
                    
                    <button id="nextBtn" class="btn btn-outline-primary btn-lg">
                        Next Post<i class="fas fa-chevron-right ms-2"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">Loading posts...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
